services:
  - type: web
    name: umd-nutrition-tracker
    runtime: node
    repo: https://github.com/Cha04ic/umd-nutrition-tracker
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production

  - type: cron
    name: umd-dining-scraper
    runtime: node
    repo: https://github.com/Cha04ic/umd-nutrition-tracker
    branch: main
    schedule: "0 11 * * 1"
    buildCommand: npm install
    startCommand: >
      /bin/bash -lc "export UMD_DINING_FETCH_NUTRITION=true;
      export START_DATE=$(date +%m/%d/%Y);
      export END_DATE=$(date -d '+6 day' +%m/%d/%Y);
      node --import tsx scripts/backfill-umd-menu.mjs"
    envVars:
      - key: DATABASE_URL
        sync: false
